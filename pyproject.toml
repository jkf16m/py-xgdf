[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-xgdf"
version = "0.1.0"
description = "xg: the Generative Development Framework — a deterministic coding agent with an interactive PTY shell and a tool SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.0", "prompt-toolkit>=3.0"]

[project.scripts]
xg = "xg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xg*"]
